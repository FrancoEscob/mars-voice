[package]
name = "dicta-provider"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
dicta-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
thiserror = "2"
tokio-util = { version = "0.7", features = ["rt"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", features = ["sink"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"
# Native store per OS; the features below add the backend. Without one, keyring
# 3 silently uses an in-memory mock, so lib.rs rejects any other target.
keyring = { version = "3.6", default-features = false }
zeroize = "1"
base64 = "0.22"

[target.'cfg(target_os = "linux")'.dependencies]
# Secret Service (GNOME Keyring, KWallet, KeePassXC). Same service as before.
keyring = { version = "3.6", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Keychain (login keychain).
keyring = { version = "3.6", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
# Credential Manager: at most 2560 bytes (1280 UTF-16 units) per secret.
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }

[dev-dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["test-util"] }

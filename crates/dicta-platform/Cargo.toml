[package]
name = "dicta-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
[dependencies]
anyhow.workspace = true
dicta-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
# Pitch-preserving speed for read-aloud playback (C++; see src/playback/mod.rs).
signalsmith-stretch = "0.1.3"
# Portable audio backend (src/audio/cpal_backend.rs, src/playback/cpal_backend.rs):
# WASAPI, CoreAudio, and PulseAudio/ALSA on Linux when PipeWire is not the
# audio server. cpal's own `pipewire` host stays off: it would force
# pipewire/v0_3_53 headers and we already have the native backend.
cpal = { version = "0.18.2", features = ["pulseaudio"] }
rubato = "5.0.1"
rtrb = "0.4"
[features]
default = ["pipewire-native"]
# Native PipeWire capture/playback/enumeration on Linux (MP-04). Builds against
# libpipewire 0.3.48+ headers (Ubuntu 22.04); without it Linux uses cpal.
pipewire-native = ["dep:pipewire"]
[target.'cfg(target_os = "linux")'.dependencies]
# Desktop backend (src/tray.rs, src/shortcuts/portal.rs, src/desktop/hyprland.rs,
# src/selection/wl_paste.rs). Other systems build stubs without them.
ksni = "0.3"
ashpd = { version = "0.11", default-features = false, features = ["tokio"] }
futures-util = "0.3"
wait-timeout = "0.2"
# No version feature: pw_buffer.requested is read behind a runtime check.
pipewire = { version = "0.10.0", optional = true }
[target.'cfg(unix)'.dependencies]
# CLOCK_MONOTONIC for shortcuts::event_stamp (Linux and macOS); process groups on Linux.
libc = "0.2"
[target.'cfg(windows)'.dependencies]
# QueryPerformanceCounter for shortcuts::event_stamp; focus, SendInput and the
# clipboard sequence number for the Windows backend (src/backend/windows.rs).
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
# Clipboard (text and, to restore it, images).
arboard = "3.6"
# Global shortcuts and tray, both on the shell thread (src/shell_windows.rs).
global-hotkey = "0.8"
# No default features: they only select the Linux (GTK) backend.
tray-icon = { version = "0.26", default-features = false }

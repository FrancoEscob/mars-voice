[workspace]
members = ["crates/dicta-core", "crates/dicta-provider", "crates/dicta-platform", "crates/dicta-ui", "crates/dicta"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "signal"] }
tracing = "0.1"
dicta-core = { path = "crates/dicta-core" }

[profile.dev]
debug = 0

[profile.release]
strip = true
lto = "thin"
